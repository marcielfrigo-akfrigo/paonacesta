<style>
/* Rota do entregador: lista do dia pronta, botão Ir (Google Maps / Waze), Entregue e salvar o local da casa */
:root{--bg:#f9f7f1;--card:#fffefa;--line:#e9e4d9;--ink:#3b2a1d;--muted:#7c6a58;--brown:#513624;--cream:#fff7e8;--ok:#2e6b4f;--okbg:#e6f1ea;--red:#b0503a;--redbg:#fbecE7;--yel:#fff4c2;--cor:#6b4a2e}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "DM Sans",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
header{background:var(--brown);color:var(--cream);padding:16px 16px 14px;position:sticky;top:0;z-index:5;padding-top:calc(16px + env(safe-area-inset-top,0px))}
header .top{display:flex;align-items:center;gap:10px}
header img{width:40px;height:40px;border-radius:10px;background:var(--cream);object-fit:contain;padding:3px}
header h1{font:400 23px/1.1 "Libre Caslon Display",Georgia,serif;margin:0}
header small{display:block;opacity:.8;font-size:13px;margin-top:2px}
.bar{height:8px;border-radius:8px;background:rgba(255,247,232,.22);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#9fd3b2;border-radius:8px;transition:width .3s}
.prog{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.92}
.dias{display:flex;gap:6px;margin-top:12px;overflow-x:auto}
.dias button{flex:0 0 auto;border:1px solid rgba(255,247,232,.35);background:transparent;color:var(--cream);border-radius:999px;padding:7px 13px;font:600 14px "DM Sans",sans-serif}
.dias button[aria-pressed=true]{background:var(--cream);color:var(--brown)}
main{padding:14px 12px 120px;max-width:640px;margin:0 auto}
.box{border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:15px}
.box h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.box.red{background:var(--redbg);border:1px solid #efc9bd}.box.red h2{color:var(--red)}
.box.inf{background:var(--card);border:1px solid var(--line)}.box.inf h2{color:var(--muted)}
.box.yel{background:var(--yel);border:1px solid #e8d48a}
.cond{position:sticky;top:var(--hh,0px);z-index:3;display:flex;align-items:baseline;justify-content:space-between;gap:8px;background:var(--cor);color:#fff;font-size:18px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;margin:16px -12px 8px;padding:9px 14px;box-shadow:0 2px 6px rgba(59,42,29,.18)}
.cond{align-items:center}.cond span{min-width:0}
.cond small{display:block;font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;opacity:.9;margin-top:1px}
.cond .mapa{flex:0 0 auto;background:#fff;color:var(--cor);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:800;letter-spacing:0;text-transform:none;text-decoration:none}
.cond.cinza{background:var(--line);color:var(--muted);font-size:14px;box-shadow:none}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 6px;display:grid;grid-template-columns:24px 1fr auto;gap:2px 8px;align-items:center}
.st .n{width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px}
.st .nm{font-weight:600;font-size:15px;line-height:1.2}.st .nm b{font-weight:800}
.st .ru{color:var(--muted);font-size:12.5px;line-height:1.25}
.st .fr{color:var(--red);font-weight:600;font-size:12.5px}
.st .tg{display:inline-block;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-top:2px}
.st .pa{background:var(--brown);color:var(--cream);border-radius:999px;padding:3px 9px;font-weight:700;font-size:13px;white-space:nowrap}
.st .acts{grid-column:1/-1;display:flex;gap:6px;margin-top:6px}
.st .acts a,.st .acts button{flex:1;min-height:38px;border-radius:9px;font:700 14px "DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.st .acts .ok{background:var(--ok);border-color:var(--ok);color:#fff}
.st .acts .loc{flex:.9;font-size:12.5px;font-weight:600;color:var(--muted)}
.st .acts .semloc{background:var(--yel);border-color:#e8d48a;color:#7a5d12}
.st .acts .ok{flex:1.2}
.st.prox{border:2px solid var(--cor);box-shadow:0 4px 12px rgba(59,42,29,.12)}
.st.prox .n{background:var(--cor);border-color:var(--cor);color:#fff}
.st.feito{opacity:.55;padding:6px 10px}.st.feito .acts{margin-top:4px}.st.feito .acts a{display:none}
.st.feito .acts .ok{background:var(--okbg);color:var(--ok);border-color:#bfdccb;min-height:32px;font-size:13px}
.ordem{display:flex;gap:8px;margin:0 0 12px}
.ordem button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:600 14px "DM Sans",sans-serif;color:var(--ink)}
.fim{text-align:center;padding:26px 12px;background:var(--okbg);border-radius:16px;color:var(--ok);font-weight:700;font-size:18px;margin-bottom:12px}
.vazio{text-align:center;color:var(--muted);padding:40px 16px}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:24px}
footer button{border:0;background:none;color:var(--brown);font:600 13px "DM Sans",sans-serif;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;z-index:20;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
/* Mapa próprio: cada casa com número, nome, casa e pães (frios em laranja) */
.cond .mapa{border:0;font-family:"DM Sans",sans-serif}
#mapa{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#mapa .mt{background:var(--brown);color:var(--cream);display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
#mapa .mt b{flex:1;font-size:16px;text-transform:uppercase;letter-spacing:.03em}
#mapa .mt button{border:0;background:var(--cream);color:var(--brown);border-radius:9px;padding:8px 12px;font:800 14px "DM Sans",sans-serif}
#mapa .mt small{font-size:12px;opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;display:block}
#mapaArea{flex:1;min-height:0}
.pin{position:absolute;left:0;top:0;transform:translate(-12px,calc(-100% - 7px));display:flex;align-items:center;gap:4px;background:#fff;color:var(--ink);border:1.5px solid var(--cor);border-radius:8px;padding:2px 6px 2px 2px;font:700 11px/1.1 "DM Sans",sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pin small{display:block;font-size:10px;font-weight:600;color:var(--muted)}.pin.fr small{color:#b5520f;font-weight:800}
.pin::after{content:"";position:absolute;left:7px;bottom:-7px;border:5px solid transparent;border-top:6px solid var(--cor);border-bottom:0}
.pin i{font-style:normal;background:var(--cor);color:#fff;border-radius:6px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11.5px;padding:0 3px}
.pin.fr{border-color:#e07a1f}.pin.fr::after{border-top-color:#e07a1f}.pin.fr i{background:#e07a1f}
.pin.prox{transform:translate(-12px,calc(-100% - 7px)) scale(1.15);transform-origin:12px 100%;z-index:2;background:var(--yel)}
.pin.sel{outline:3px solid #1a73e8}
.longe .pin span{display:none}.longe .pin{padding:2px}
.pin.ok{opacity:.55;border-color:var(--ok)}.pin.ok::after{border-top-color:var(--ok)}.pin.ok i{background:var(--ok)}
.ponto{width:10px;height:10px;border-radius:50%;background:var(--cor);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);transform:translate(-5px,-5px)}
#mapaFicha{background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
#mapaFicha .nav{display:flex;align-items:center;justify-content:center;min-height:42px;margin-bottom:8px;border-radius:10px;background:#1a73e8;color:#fff;font:700 15px "DM Sans",sans-serif;text-decoration:none}
#mapaFicha .nm{font-weight:700;font-size:16px}#mapaFicha .nm b{font-weight:800}
#mapaFicha .fr{color:var(--red);font-weight:700;font-size:13px}
#mapaFicha .acts{display:flex;gap:6px;margin-top:8px}
#mapaFicha .acts a,#mapaFicha .acts button{flex:1;min-height:42px;border-radius:10px;font:700 15px "DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#mapaFicha .acts .ok{background:var(--ok);border-color:var(--ok);color:#fff}
</style></head><body>
<header><div class="top"><img src="../logo-pao-na-cesta.png" alt=""><div><h1 id="tit">Rota</h1><small id="sub">Carregando…</small></div></div>
<div class="bar" aria-hidden="true"><i id="barra" style="width:0"></i></div><div class="prog"><span id="prog"></span><span id="paes"></span></div>
<div class="dias" id="dias" role="tablist"></div></header>
<main id="main"><p class="vazio">Carregando a rota…</p></main>
<div id="mapa" hidden><div class="mt"><b id="mapaTit"></b><button type="button" data-fechar-mapa>✕ Lista</button></div><div id="mapaArea"></div><div id="mapaFicha"></div></div>
<script>window.FIREBASE_CONFIG = {"apiKey":"AIzaSyCDjC2i08rrbegFaBAPRg33wJLuHLjmEWk","authDomain":"pao-na-cesta.firebaseapp.com","projectId":"pao-na-cesta","storageBucket":"pao-na-cesta.firebasestorage.app","messagingSenderId":"562755057813","appId":"1:562755057813:web:61f7132e3d23bb211c039c"};</script>
<script type="module">
// O Firebase é carregado depois (import dinâmico): a rota aparece primeiro por uma leitura simples, que funciona em qualquer celular
const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[ch]));
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const DOWL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const nomeDia = D => { const [y,m,d] = D.split("-").map(Number); return DOWL[new Date(y, m-1, d).getDay()] + ", " + D.slice(8,10) + "/" + D.slice(5,7); };
const ls = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function toast(t){ document.querySelectorAll(".toast").forEach(x => x.remove()); const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2800); }

const cod = location.hash.replace(/^#/, "").trim();
const HOJE = iso(new Date());
let R = null, dia = null, app = ls.get("rota-app") || "google";
const locais = {};          // locais salvos agora neste celular (antes de a gestão gravar no cliente)
let pos = null;             // última posição do GPS

const naoAchou = () => { $("#sub").textContent = ""; $("#main").innerHTML = `<p class="vazio">Rota não encontrada. Peça de novo o link ao Marciel.</p>`; };
const semConexao = () => { if (R) return; $("#sub").textContent = "Sem conexão"; $("#main").innerHTML = `<p class="vazio">Não consegui abrir a rota. Confira a internet.<br><br><button type="button" class="ok" onclick="location.reload()">Tentar de novo</button></p>`; };
// valor do Firestore REST -> valor normal
const val = v => "mapValue" in v ? campos(v.mapValue.fields) : "arrayValue" in v ? (v.arrayValue.values || []).map(val)
  : "integerValue" in v ? Number(v.integerValue) : "doubleValue" in v ? v.doubleValue : "booleanValue" in v ? v.booleanValue
  : "stringValue" in v ? v.stringValue : "timestampValue" in v ? v.timestampValue : null;
const campos = f => Object.fromEntries(Object.entries(f || {}).map(([k, v]) => [k, val(v)]));
let fb = null;              // { ref, updateDoc, deleteField } quando o Firebase terminar de carregar
let fbPronto;
const fbEspera = new Promise(r => fbPronto = r);
async function gravar(campo, valor) {   // valor null = apagar
  const f = await Promise.race([fbEspera, new Promise((_, n) => setTimeout(n, 15000))]);
  await f.updateDoc(f.ref, { [campo]: valor === null ? f.deleteField() : valor });
}

if (!cod) { $("#sub").textContent = ""; $("#main").innerHTML = `<p class="vazio">Link incompleto. Peça de novo o link da sua rota ao Marciel.</p>`; }
else {
  const C = window.FIREBASE_CONFIG;
  fetch(`https://firestore.googleapis.com/v1/projects/${C.projectId}/databases/(default)/documents/rotas/${encodeURIComponent(cod)}?key=${C.apiKey}`, { cache: "no-store" })
    .then(r => r.status === 404 ? (R || naoAchou(), null) : r.ok ? r.json() : Promise.reject())
    .then(j => { if (j && !R) { R = campos(j.fields); render(); } })
    .catch(() => {});
  setTimeout(semConexao, 15000);
  (async () => {
    const { initializeApp } = await import(SDK + "firebase-app.js");
    const { initializeFirestore, doc, onSnapshot, updateDoc, deleteField } = await import(SDK + "firebase-firestore.js");
    const db = initializeFirestore(initializeApp(C), { experimentalForceLongPolling: true });
    const ref = doc(db, "rotas", cod);
    fb = { ref, updateDoc, deleteField }; fbPronto(fb);
    onSnapshot(ref, s => { if (!s.exists()) return naoAchou(); R = s.data(); render(); }, () => {});
  })().catch(() => {});

  // Entregue / desfazer
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-ok]"); if (b) {
      const id = b.dataset.ok, feito = !!((R.entregues || {})[dia] || {})[id];
      R.entregues = R.entregues || {}; R.entregues[dia] = { ...(R.entregues[dia] || {}) };
      if (feito) delete R.entregues[dia][id]; else R.entregues[dia][id] = Date.now();
      render();
      try { await gravar("entregues." + dia + "." + id, feito ? null : Date.now()); }
      catch (er) { toast("Sem internet: tente marcar de novo daqui a pouco."); }
      if (!feito && !M.aberto) window.scrollTo({ top: 0, behavior: "smooth" });
      if (!feito && M.aberto) { M.sel = null; desenharMapa(); }
      return;
    }
    const l = e.target.closest("[data-loc]"); if (l) {
      const it = itensDia().find(x => x.id === l.dataset.loc); if (!it) return;
      if (!confirm(`Você está parado na frente da casa de ${it.nome}${it.casa ? " (" + it.casa + ")" : ""}?\n\nO celular vai gravar este lugar como o local da casa.`)) return;
      if (!navigator.geolocation) { toast("Este celular não deixa usar o GPS aqui."); return; }
      toast("Pegando o local pelo GPS…");
      navigator.geolocation.getCurrentPosition(async p => {
        const loc = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), prec: Math.round(p.coords.accuracy), em: Date.now() };
        locais[it.id] = loc; render();
        try { await gravar("novosLocais." + it.id, loc); toast("Local da casa salvo ✓"); }
        catch (er) { toast("Sem internet: o local não foi salvo. Tente de novo."); }
      }, () => toast("Não consegui o GPS. Libere a localização para o navegador e tente de novo."), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
      return;
    }
    const m = e.target.closest("[data-mapa]"); if (m) { abrirMapa(m.dataset.mapa); return; }
    if (e.target.closest("[data-fechar-mapa]")) { fecharMapa(); return; }
    const d = e.target.closest("[data-dia]"); if (d) { dia = d.dataset.dia; render(); window.scrollTo(0, 0); return; }
    if (e.target.closest("[data-ordenar]")) { ordenarPeloCaminho(); return; }
    if (e.target.closest("[data-original]")) { ls.set("rota-ordem-" + dia, null); render(); toast("Voltou para a ordem da lista"); return; }
    const a = e.target.closest("[data-app]"); if (a) { app = a.dataset.app; ls.set("rota-app", app); render(); return; }
  });
}

const itensDia = () => ((R && R.dias && R.dias[dia]) || {}).itens || [];
const locDe = it => locais[it.id] || (it.lat && it.lng ? { lat: it.lat, lng: it.lng } : null);
// Google Maps com as casas que faltam, em sequência, saindo de onde o entregador está (o app aceita até 10 paradas)
function linkNavegar(lista){
  const ps = lista.filter(locDe).slice(0, 10).map(it => { const l = locDe(it); return l.lat + "," + l.lng; });
  const fim = ps.pop();
  return `https://www.google.com/maps/dir/?api=1&destination=${fim}${ps.length ? "&waypoints=" + encodeURIComponent(ps.join("|")) : ""}&travelmode=driving&dir_action=navigate`;
}
function linkIr(it){
  const l = locDe(it);
  if (l) return app === "waze" ? `https://waze.com/ul?ll=${l.lat},${l.lng}&navigate=yes` : `https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}&travelmode=driving`;
  const q = [it.rua, it.casa, it.cond, "Presidente Prudente - SP"].filter(Boolean).join(", ");
  return app === "waze" ? `https://waze.com/ul?q=${encodeURIComponent(q)}&navigate=yes` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}

// Ordem pelo caminho: a partir de onde o entregador está, vai sempre para a casa mais perto
// (por condomínio: termina um antes de ir para o próximo). Casas sem local ficam no fim do condomínio.
const dist = (a, b) => { const k = Math.PI / 180, x = (b.lng - a.lng) * k * Math.cos((a.lat + b.lat) / 2 * k), y = (b.lat - a.lat) * k; return Math.hypot(x, y); };
function ordenarPeloCaminho(){
  if (!navigator.geolocation) { toast("Este celular não deixa usar o GPS aqui."); return; }
  toast("Vendo onde você está…");
  navigator.geolocation.getCurrentPosition(p => {
    pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    const itens = itensDia(), grupos = {};
    itens.forEach(it => (grupos[it.cond] = grupos[it.cond] || []).push(it));
    const centro = g => { const c = g.map(locDe).filter(Boolean); return c.length ? { lat: c.reduce((s, l) => s + l.lat, 0) / c.length, lng: c.reduce((s, l) => s + l.lng, 0) / c.length } : null; };
    let aqui = pos; const ordem = [];
    const conds = Object.keys(grupos), comLoc = conds.filter(c => centro(grupos[c])), semLoc = conds.filter(c => !centro(grupos[c]));
    while (comLoc.length) {
      comLoc.sort((a, b) => dist(aqui, centro(grupos[a])) - dist(aqui, centro(grupos[b])));
      const g = grupos[comLoc.shift()], resto = g.filter(locDe);
      while (resto.length) { resto.sort((a, b) => dist(aqui, locDe(a)) - dist(aqui, locDe(b))); const it = resto.shift(); ordem.push(it.id); aqui = locDe(it); }
      g.filter(it => !locDe(it)).forEach(it => ordem.push(it.id));
    }
    semLoc.forEach(c => grupos[c].forEach(it => ordem.push(it.id)));
    ls.set("rota-ordem-" + dia, ordem); render(); toast("Rota organizada pelo caminho ✓");
  }, () => toast("Não consegui o GPS. Libere a localização para o navegador."), { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}

// ---------- Mapa próprio (Leaflet): etiqueta em cada casa com nº da ordem, nome, casa e pães ----------
let V = { itens: [], num: new Map(), ok: {} };
const M = { aberto: false, cond: "", map: null, camada: null, sel: null, linhas: {}, ajustado: "", eu: null };
const LEAF = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
let leafEspera = null;
function carregarLeaflet(){
  if (window.L) return Promise.resolve();
  if (!leafEspera) leafEspera = new Promise((ok, erro) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = LEAF + "leaflet.min.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = LEAF + "leaflet.min.js"; js.onload = ok; js.onerror = () => { leafEspera = null; erro(); }; document.head.appendChild(js);
  });
  return leafEspera;
}
async function abrirMapa(cond){
  M.aberto = true; M.cond = cond; M.sel = null; M.ajustado = "";
  $("#mapa").hidden = false; document.body.style.overflow = "hidden";
  try { await carregarLeaflet(); } catch (e) { toast("Sem internet para abrir o mapa."); fecharMapa(); return; }
  if (!M.map) {
    M.map = L.map("mapaArea", { zoomControl: false, attributionControl: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(M.map);
    M.camada = L.layerGroup().addTo(M.map);
    // de longe só o número (os nomes se amontoam); chegando perto aparecem nome, casa e pães
    const zoomNomes = () => $("#mapaArea").classList.toggle("longe", M.map.getZoom() < 16);
    M.map.on("zoomend", zoomNomes); M.map.whenReady(zoomNomes);
    M.map.on("click", () => { M.sel = null; desenharMapa(); });
    // bolinha azul: onde o entregador está agora
    if (navigator.geolocation) navigator.geolocation.watchPosition(p => {
      const ll = [p.coords.latitude, p.coords.longitude];
      if (M.eu) M.eu.setLatLng(ll); else M.eu = L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#1a73e8", fillOpacity: 1 }).addTo(M.map);
    }, () => {}, { enableHighAccuracy: true, maximumAge: 5000 });
  }
  setTimeout(() => { M.map.invalidateSize(); desenharMapa(); }, 30);
}
function fecharMapa(){ M.aberto = false; $("#mapa").hidden = true; document.body.style.overflow = ""; }
// linha pelas ruas (OSRM); se não der, linha reta tracejada
async function linhaRuas(pts){
  const chave = pts.map(p => p.lat + "," + p.lng).join(";");
  if (M.linhas[chave]) return M.linhas[chave];
  try {
    const r = await fetch("https://router.project-osrm.org/route/v1/driving/" + pts.map(p => p.lng + "," + p.lat).join(";") + "?overview=full&geometries=geojson");
    const j = await r.json(); if (!j.routes || !j.routes[0]) throw 0;
    return M.linhas[chave] = j.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
  } catch (e) { return null; }
}
// nome curto para a etiqueta: "Marina B.", "Anaue"
const curto = n => { const p = String(n || "").replace(/\(.*?\)/g, "").split(/[\s\/]+/).filter(Boolean); return p.length > 1 ? p[0] + " " + p[1][0] + "." : p[0] || ""; };
function desenharMapa(){
  if (!M.map || !R) return;
  const todos = V.itens.filter(it => !M.cond || it.cond === M.cond), com = todos.filter(locDe);
  const falta = todos.filter(it => !V.ok[it.id]), prox = falta[0];
  const nPaes = falta.reduce((s, it) => s + (it.paes || 0), 0);
  $("#mapaTit").innerHTML = `${esc(M.cond || "Rota do dia")}<small>${falta.length ? `Faltam ${falta.length} · ${nPaes} pães` : "Tudo entregue ✓"}${todos.length > com.length ? ` · ${todos.length - com.length} sem local salvo` : ""}</small>`;
  M.camada.clearLayers();
  // linha por condomínio, ligando as casas que faltam na ordem
  const grupos = {}; falta.filter(locDe).forEach(it => (grupos[it.cond] = grupos[it.cond] || []).push(locDe(it)));
  Object.values(grupos).forEach(async pts => {
    if (pts.length < 2) return;
    const reta = pts.map(p => [p.lat, p.lng]);
    const tracejada = L.polyline(reta, { color: R.cor || "#6b4a2e", weight: 3, opacity: .5, dashArray: "6 6" }).addTo(M.camada);
    const ruas = await linhaRuas(pts);
    if (ruas && M.aberto) { M.camada.removeLayer(tracejada); L.polyline(ruas, { color: R.cor || "#6b4a2e", weight: 5, opacity: .75 }).addTo(M.camada); }
  });
  com.forEach(it => {
    const l = locDe(it), feito = !!V.ok[it.id], fr = it.frios && it.frios.length;
    const cls = "pin" + (fr ? " fr" : "") + (feito ? " ok" : "") + (it === prox ? " prox" : "") + (it.id === M.sel ? " sel" : "");
    const html = `<div class="${cls}"><i>${feito ? "✓" : V.num.get(it.id)}</i><span>${esc(curto(it.nome))}${it.casa ? " " + esc(it.casa) : ""}<small>${it.paes} pães${fr ? " · 🧀 " + esc(it.frios.join(", ")) : ""}</small></span></div>`;
    L.marker([l.lat, l.lng], { icon: L.divIcon({ className: "", html: `<div class="ponto"></div>${html}`, iconSize: [0, 0] }), zIndexOffset: it.id === M.sel ? 2000 : it === prox ? 1000 : feito ? -1000 : 0 })
      .on("click", ev => { L.DomEvent.stopPropagation(ev); M.sel = it.id; desenharMapa(); }).addTo(M.camada);
  });
  const chave = M.cond + "|" + dia;
  if (M.ajustado !== chave && com.length) { M.ajustado = chave; M.map.fitBounds(com.map(it => { const l = locDe(it); return [l.lat, l.lng]; }), { padding: [60, 30], maxZoom: 19 }); }
  // ficha embaixo: a casa tocada, ou a próxima a entregar
  const it = todos.find(x => x.id === M.sel) || prox;
  if (!it) { $("#mapaFicha").innerHTML = `<div class="nm">Todas as entregas deste mapa foram feitas ✓</div>`; return; }
  const feito = !!V.ok[it.id], nav = falta.filter(locDe);
  $("#mapaFicha").innerHTML = (nav.length > 1 ? `<a class="nav" href="${linkNavegar(nav)}" target="_blank" rel="noopener">▶ Navegar no Google Maps: ${Math.min(nav.length, 10)} casas na ordem</a>` : "") + `<div class="nm">${it === prox ? "Próxima: " : ""}${V.num.get(it.id)} · ${esc(it.nome)}${it.casa ? ` <b>${esc(it.casa)}</b>` : ""} · ${it.paes} pães</div>${it.frios && it.frios.length ? `<div class="fr">🧀 Levar: ${esc(it.frios.join(", "))}</div>` : ""}${locDe(it) ? "" : `<div class="fr">Sem local salvo nesta casa</div>`}
    <div class="acts"><a href="${linkIr(it)}" target="_blank" rel="noopener">➜ Ir</a><button type="button" class="ok" data-ok="${it.id}">${feito ? "✓ Entregue · desfazer" : "✓ Entregue"}</button></div>`;
}

function render(){
  if (!R) return;
  const dias = Object.keys(R.dias || {}).filter(D => D >= HOJE).sort();
  if (!dia || !dias.includes(dia)) dia = dias[0];
  document.documentElement.style.setProperty("--cor", R.cor || "#6b4a2e");
  $("#tit").textContent = "Rota do " + (R.entregador || "");
  document.title = "Rota do " + (R.entregador || "") + " · Pão na Cesta";
  $("#dias").innerHTML = dias.slice(0, 3).map(D => `<button type="button" data-dia="${D}" aria-pressed="${D === dia}">${D === HOJE ? "Hoje" : nomeDia(D).split(",")[0]} ${D.slice(8,10)}/${D.slice(5,7)}</button>`).join("");
  if (!dia) { $("#sub").textContent = ""; $("#main").innerHTML = `<p class="vazio">Nenhuma rota publicada para os próximos dias.</p>`; return; }
  const X = R.dias[dia], ok = (R.entregues || {})[dia] || {};
  // ordem: a salva pelo "Organizar pelo caminho" (se ainda serve) ou a da lista da gestão
  const salva = ls.get("rota-ordem-" + dia), base = X.itens || [];
  let itens = base;
  if (Array.isArray(salva)) { const p = new Map(salva.map((id, i) => [id, i])); itens = base.slice().sort((a, b) => (p.has(a.id) ? p.get(a.id) : 1e3 + base.indexOf(a)) - (p.has(b.id) ? p.get(b.id) : 1e3 + base.indexOf(b))); }
  const num = new Map(itens.map((it, i) => [it.id, i + 1]));
  const falta = itens.filter(it => !ok[it.id]), feitos = itens.filter(it => ok[it.id]);
  V = { itens, num, ok };
  const nOk = feitos.length, tot = itens.length;
  $("#sub").textContent = nomeDia(dia) + (dia === HOJE ? " · hoje" : "");
  $("#barra").style.width = tot ? Math.round(nOk / tot * 100) + "%" : "0";
  $("#prog").textContent = `${nOk} de ${tot} entregues`;
  $("#paes").textContent = `${X.paes || 0} pães${(X.pessoal || []).length ? " (com sua sacola)" : ""}`;

  const card = (it, prox) => {
    const l = locDe(it), feito = !!ok[it.id];
    return `<div class="st${prox ? " prox" : ""}${feito ? " feito" : ""}"><span class="n">${num.get(it.id)}</span>
      <div><div class="nm">${esc(it.nome)}${it.casa ? ` <b>${esc(it.casa)}</b>` : ""}</div>${it.rua ? `<div class="ru">${esc(it.rua)}</div>` : ""}${it.frios && it.frios.length ? `<div class="fr">+ ${esc(it.frios.join(", "))}</div>` : ""}${it.nova ? `<span class="tg">CLIENTE NOVA · LEVAR A CESTA</span>` : ""}</div>
      <span class="pa">${it.paes} pães</span>
      <div class="acts"><a href="${linkIr(it)}" target="_blank" rel="noopener">➜ Ir</a>${feito ? "" : l ? `<button type="button" class="loc" data-loc="${it.id}">📍 Corrigir local</button>` : `<button type="button" class="loc semloc" data-loc="${it.id}">📍 Salvar local</button>`}<button type="button" class="ok" data-ok="${it.id}">${feito ? "✓ Entregue · desfazer" : "✓ Entregue"}</button></div></div>`;
  };
  let h = "";
  if ((X.recolher || []).length) h += `<div class="box red"><h2>Recolher a cesta (não entregar)</h2><ul>${X.recolher.map(r => `<li><b>${esc(r.nome)}</b>${r.casa ? " " + esc(r.casa) : ""} · ${esc(r.cond)}</li>`).join("")}</ul></div>`;
  if (falta.length) {
    h += `<div class="ordem"><button type="button" data-mapa="">🗺 Ver tudo no mapa</button><button type="button" data-ordenar>📍 Organizar pelo caminho</button>${Array.isArray(salva) ? `<button type="button" data-original>Ordem da lista</button>` : ""}</div>`;
    let cond = "";
    falta.forEach((it, i) => {
      if (it.cond !== cond) {
        cond = it.cond; const grupo = [];
        for (let j = i; j < falta.length && falta[j].cond === cond; j++) grupo.push(falta[j]);
        const n = grupo.length, p = grupo.reduce((s, x) => s + (x.paes || 0), 0);
        h += `${i ? "</section>" : ""}<section><div class="cond"><span>${esc(cond)}<small>${n} ${n === 1 ? "entrega" : "entregas"} · ${p} pães</small></span><button type="button" class="mapa" data-mapa="${esc(cond)}">🗺 Mapa</button></div>`;
      }
      h += card(it, i === 0);
    });
    h += "</section>";   // cada condomínio numa seção: o título só fica grudado no topo enquanto a lista dele está na tela
  } else if (tot) h += `<div class="fim">Todas as ${tot} entregas feitas. Bom trabalho! 🥖</div>`;
  else h += `<p class="vazio">Nenhuma entrega neste dia.</p>`;
  if ((X.fora || []).length) h += `<div class="box inf"><h2>Não entregar neste dia</h2><ul>${X.fora.map(f => `<li>${esc(f.nome)} · ${esc(f.cond)} <span style="color:var(--muted)">(${esc(f.txt)})</span></li>`).join("")}</ul></div>`;
  if ((X.pessoal || []).length) h += `<div class="box inf"><h2>Sua sacola</h2>${X.pessoal.join(" + ")} pães</div>`;
  if (feitos.length) { h += `<section><div class="cond cinza">Entregues (${feitos.length})</div>`; feitos.forEach(it => h += card(it, false)); h += "</section>"; }
  h += `<footer>Abrir o caminho no: <button type="button" data-app="google"${app === "google" ? ' style="font-weight:800"' : ""}>Google Maps</button> · <button type="button" data-app="waze"${app === "waze" ? ' style="font-weight:800"' : ""}>Waze</button><br>A rota atualiza sozinha quando o Marciel muda alguma coisa.</footer>`;
  $("#main").innerHTML = h;
  alturaTopo();
  if (M.aberto) desenharMapa();
}
// o nome do condomínio gruda logo abaixo do topo marrom ao rolar
function alturaTopo(){ document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px"); }
addEventListener("resize", alturaTopo);
</script>
</body></html>
