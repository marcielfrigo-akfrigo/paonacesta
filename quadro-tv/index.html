<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quadro das entregas</title>
<link rel="icon" href="../logo-pao-na-cesta.png">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Libre+Caslon+Display&amp;display=swap">
<style>
/* Quadro do projetor, no desenho que o Marciel mandou em 23/11: fundo branco, faixas bege por grupo e rodapé marrom.
   Tela cheia 16:9, sem rolagem. CSS simples (sem variáveis nem grid) para navegador antigo de TV/projetor. */
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{font-family:"DM Sans",Roboto,"Helvetica Neue",Arial,sans-serif;color:#000;cursor:none}
#raiz{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.a,.r{position:absolute;box-sizing:border-box}
.a{white-space:nowrap;overflow:hidden}
.a svg,.r svg{position:absolute;display:block}
.m{text-align:center}
.titulo{color:#3b1d10;font-weight:500}
.pil{background:#fdf6ea;border:2px solid #c9963f}
.pilt{color:#4a2412;font-weight:700}
.info{color:#2b2b2b;text-align:right}
.info i{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:#16a34a;margin-right:.45em}
.info.ruim{color:#a33a22;font-weight:600}
.info.ruim i{background:#c0392b}
.cabt{background:#f0ece6}
.prod{color:#4a1d0f;font-weight:700}
.ent{text-align:center;font-weight:700;color:#000}
.ent i{display:inline-block;width:.68em;height:.68em;border-radius:50%;margin-right:.4em}
.faixa{background:#e8d3b3}
.grupo{color:#4a1d0f;font-weight:700}
.rot{color:#000;font-weight:500}
.n{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.z{text-align:center;color:#8d857b;font-weight:500}
.fio{position:absolute;background:#d9d4cc}
.ouro{background:#cf9f45}
.sep{background:#8a5a34}
.rod{background:#4f2814}
.rodl{color:#fff;font-weight:700}
.rodn{color:#fff;font-weight:500;text-align:center}
.rodv{color:#f7dc8c;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.vazio{position:absolute;left:0;top:40%;width:100%;text-align:center;color:#3b1d10;font-weight:500;line-height:1.4}
</style></head><body>
<div id="raiz"></div>
<script>
(function () {
  var CHAVE = "AIzaSyCDjC2i08rrbegFaBAPRg33wJLuHLjmEWk";   // chave pública do app web (a mesma da tela de rota)
  var URL_BASE = "https://firestore.googleapis.com/v1/projects/pao-na-cesta/databases/(default)/documents/publico/quadro-";
  var DOW = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
  var raiz = document.getElementById("raiz");

  // ----- parâmetros do link: #código (ou ?t=código), ?virada=HH:MM -----
  function param(nome) {
    var m = new RegExp("[?&]" + nome + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }
  var cod = (location.hash || "").replace(/^#/, "").split("?")[0] || param("t");
  var viradaLink = param("virada");

  var dados = null, ultimoOk = "", offline = false, erroLink = false, aguardando = false;
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function dois(n) { return (n < 10 ? "0" : "") + n; }

  // Horário de Brasília (UTC-3, sem horário de verão desde 2019), não importa o fuso do aparelho
  function agoraSP() {
    var t = new Date(new Date().getTime() - 3 * 3600 * 1000);
    return { D: t.getUTCFullYear() + "-" + dois(t.getUTCMonth() + 1) + "-" + dois(t.getUTCDate()), min: t.getUTCHours() * 60 + t.getUTCMinutes(),
      hm: dois(t.getUTCHours()) + ":" + dois(t.getUTCMinutes()) };
  }
  function minutos(hm, padrao) {
    var m = /^(\d{1,2}):(\d\d)$/.exec(hm || "");
    return m ? Number(m[1]) * 60 + Number(m[2]) : padrao;
  }
  function somaDia(D, n) {
    var p = D.split("-"), t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return t.getUTCFullYear() + "-" + dois(t.getUTCMonth() + 1) + "-" + dois(t.getUTCDate());
  }

  // ----- busca o quadro (a cada 60 s) -----
  function guardar(txt) { try { localStorage.setItem("quadroTv:" + cod, txt); } catch (e) {} }
  function lerGuardado() { try { return localStorage.getItem("quadroTv:" + cod); } catch (e) { return null; } }
  function aceitar(txt) {
    var o = JSON.parse(txt);
    if (o && o.dias) { dados = o; return true; }
    return false;
  }
  function buscar() {
    var x = new XMLHttpRequest(), pronto = false;
    x.open("GET", URL_BASE + encodeURIComponent(cod) + "?key=" + CHAVE + "&_=" + new Date().getTime(), true);
    x.timeout = 20000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || pronto) return;
      pronto = true;
      if (x.status === 200) {
        try {
          var j = JSON.parse(x.responseText), txt = j.fields.json.stringValue;
          if (aceitar(txt)) { guardar(txt); offline = false; erroLink = false; aguardando = false; ultimoOk = agoraSP().hm; }
        } catch (e) { offline = true; }
      } else if (x.status === 404) { if (!dados) aguardando = true; else offline = true; }
      else if (x.status === 403) { if (!dados) erroLink = true; else offline = true; }
      else offline = true;
      desenhar();
    };
    x.onerror = x.ontimeout = function () { if (pronto) return; pronto = true; offline = true; desenhar(); };
    try { x.send(); } catch (e) { offline = true; desenhar(); }
  }

  // ----- qual dia mostrar: hoje até a hora da virada; depois, o próximo dia com entrega -----
  function diaMostrado(a) {
    var lista = [], k;
    for (k in dados.dias) if (dados.dias.hasOwnProperty(k)) lista.push(k);
    lista.sort();
    if (!lista.length) return { D: "", velho: true };
    var virada = minutos(viradaLink || dados.virada, 14 * 60);
    var alvo = a.min >= virada ? somaDia(a.D, 1) : a.D;
    for (var i = 0; i < lista.length; i++) if (lista[i] >= alvo) return { D: lista[i], velho: false };
    return { D: lista[lista.length - 1], velho: true };   // o quadro publicado já ficou para trás
  }

  // ----- monta as linhas da tabela -----
  function soma(cols, f) { var t = 0; for (var i = 0; i < cols.length; i++) t += f(cols[i]) || 0; return t; }
  function linhasDoDia(dia, cols) {
    var out = [], i, j, q, tams = {}, lis;
    for (i = 0; i < cols.length; i++) for (q in (cols[i].sac || {})) if (cols[i].sac.hasOwnProperty(q) && cols[i].sac[q] > 0) tams[q] = 1;
    var ordem = []; for (q in tams) if (tams.hasOwnProperty(q)) ordem.push(Number(q));
    ordem.sort(function (a, b) { return b - a; });
    function bloco(titulo, itens, rotulo, pega) {
      if (!itens.length) return;
      out.push({ t: "tit", rot: titulo });
      for (var n = 0; n < itens.length; n++) {
        (function (it) {
          var v = [], tot = 0;
          for (var c = 0; c < cols.length; c++) { var x = pega(cols[c], it) || 0; v.push(x); tot += x; }
          out.push({ t: "lin", rot: rotulo(it), v: v, tot: tot });
        })(itens[n]);
      }
    }
    bloco("PÃO FRANCÊS", ordem, function (q) { return q + " pães"; }, function (c, q) { return (c.sac || {})[q]; });
    function comAlgo(lista) {
      var r = [];
      for (var n = 0; n < (lista || []).length; n++) if (soma(cols, function (c) { return (c.fri || {})[lista[n]]; }) > 0) r.push(lista[n]);
      return r;
    }
    var pegaF = function (c, it) { return (c.fri || {})[it]; }, rot = function (it) { return it; };
    bloco("PÃES ESPECIAIS", comAlgo(dia.esp), rot, pegaF);
    bloco("FRIOS", comAlgo(dia.fri), rot, pegaF);
    return out;
  }

  // ----- desenha tudo para caber exatamente na tela -----
  var CORES = { Careca: "#E0262F", Dennis: "#FBCB0A", Miro: "#0B84FF", Bruno: "#85888C" };
  function corDe(c) { return CORES[c.n] || c.cor || "#6b4a2e"; }
  var R = Math.round;
  function cx(cls, x, y, w, alt, fonte, html) {
    return '<div class="a ' + cls + '" style="left:' + R(x) + "px;top:" + R(y) + "px;width:" + R(w) + "px;height:" + R(alt) + "px;line-height:" + R(alt) + "px;font-size:" + R(fonte) + 'px">' + html + "</div>";
  }
  function fio(cls, x, y, w, alt) { return '<div class="fio ' + cls + '" style="left:' + R(x) + "px;top:" + R(y) + "px;width:" + R(w) + "px;height:" + R(alt) + 'px"></div>'; }
  function caixa(cls, x, y, w, alt, raio) { return '<div class="r ' + cls + '" style="left:' + R(x) + "px;top:" + R(y) + "px;width:" + R(w) + "px;height:" + R(alt) + "px;border-radius:" + raio + '"></div>'; }
  function svg(x, y, w, alt, vb, dentro, attrs) { return '<svg style="position:absolute;left:' + R(x) + "px;top:" + R(y) + 'px" width="' + R(w) + '" height="' + R(alt) + '" viewBox="' + vb + '" ' + (attrs || "") + ">" + dentro + "</svg>"; }
  var TRACO = 'fill="none" stroke-linecap="round" stroke-linejoin="round" ';
  var DESENHO = {
    "PÃO FRANCÊS": '<g transform="rotate(-14 24 16)"><rect x="3" y="8" width="42" height="16" rx="8" fill="#eab25c" stroke="#7a3f16" stroke-width="2.2"/><path d="M14 10l5 8M23 9.500l5 8M32 10l5 8" fill="none" stroke="#fff1cf" stroke-width="2.600" stroke-linecap="round"/></g>',
    "PÃES ESPECIAIS": '<path d="M7 26C1 22 4 13 12 13 14 6 22 5 25 8 30 5 36 8 37 13 45 13 47 22 41 26Z" fill="#eab25c" stroke="#7a3f16" stroke-width="2.200" stroke-linejoin="round"/><path d="M17 16c2-2 4-2 6 0M28 15c2-2 4-2 5 0" fill="none" stroke="#fff1cf" stroke-width="2.400" stroke-linecap="round"/>',
    "FRIOS": '<path d="M4 18L31 5c8 1 12 6 13 13z" fill="#f6cf6b" stroke="#7a3f16" stroke-width="2.200" stroke-linejoin="round"/><path d="M4 18h40v10H4z" fill="#eab25c" stroke="#7a3f16" stroke-width="2.200" stroke-linejoin="round"/><circle cx="14" cy="23" r="2.200" fill="#fff1cf"/><circle cx="28" cy="22.500" r="2.800" fill="#fff1cf"/><circle cx="37" cy="24" r="1.700" fill="#fff1cf"/>'
  };
  var CALEND = '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>';
  var CAMINHAO = '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.650a1 1 0 0 0-.220-.620l-3.480-4.350A1 1 0 0 0 17.520 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>';
  function recado(H, txt) { raiz.innerHTML = '<div class="vazio" style="font-size:' + R(H * 0.05) + 'px">' + txt + "</div>"; }
  function desenhar() {
    var W = window.innerWidth || document.documentElement.clientWidth, H = window.innerHeight || document.documentElement.clientHeight;
    if (!W || !H) return;
    if (erroLink || !cod) return recado(H, "Link do quadro incorreto.<br>Peça o link novo ao Marciel.");
    if (!dados && aguardando) return recado(H, "Aguardando o primeiro quadro.<br>Abra a gestão no computador.");
    if (!dados) return recado(H, "Carregando o quadro…");

    var a = agoraSP(), sel = diaMostrado(a), dia = dados.dias[sel.D], i, k;
    var p = sel.D.split("-"), dow = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
    // o Marciel não ganha coluna: os pães dele viram uma observação no canto
    var todos = (dia && dia.cols) || [], cols = [], marciel = 0;
    for (i = 0; i < todos.length; i++) { if (todos[i].n === "Marciel") marciel += todos[i].paes || 0; else cols.push(todos[i]); }

    // ----- cabeçalho: logo, título, dia e hora -----
    var U = Math.min(H, W * 9 / 16), mx = W * 0.016, larg = W - mx * 2, e1 = Math.max(1, R(H / 600));
    var cabY = H * 0.012, cabH = H * 0.092, logoW = cabH * 375 / 270, x = mx + W * 0.012;
    var h = '<img alt="" src="../logo-pao-na-cesta.png" style="position:absolute;left:' + R(x) + "px;top:" + R(cabY) + "px;width:" + R(logoW) + "px;height:" + R(cabH) + 'px">';
    x += logoW + W * 0.018;
    h += fio("sep", x, cabY + cabH * 0.17, Math.max(2, e1), cabH * 0.66);
    x += W * 0.018;
    h += cx("titulo", x, cabY, W * 0.3, cabH, U * 0.041, "Painel de Distribuição");
    var pilW = W * 0.222, pilH = cabH * 0.66, pilX = W * 0.485, pilY = cabY + (cabH - pilH) / 2, icoH = pilH * 0.56;
    h += caixa("pil", pilX, pilY, pilW, pilH, R(pilH / 2) + "px") + svg(pilX + pilH * 0.5, pilY + (pilH - icoH) / 2, icoH, icoH, "0 0 24 24", CALEND, TRACO + 'stroke="#b9812b" stroke-width="2"') +
      cx("pilt m", pilX + pilH * 0.5 + icoH, pilY, pilW - pilH * 0.8 - icoH, pilH, U * 0.031, esc(DOW[dow]) + " · " + p[2] + "/" + p[1]);
    var txt, ruim = "";
    if (offline) { txt = "Sem internet"; ruim = " ruim"; }
    else if (sel.velho) { txt = "Abra a gestão"; ruim = " ruim"; }
    else txt = "Atualizado às <b>" + esc(ultimoOk || a.hm) + "</b>";
    var infX = pilX + pilW + W * 0.01, infW = W - mx - W * 0.012 - infX;
    h += cx("info" + ruim, infX, cabY + (marciel ? cabH * 0.14 : 0), infW, marciel ? cabH * 0.42 : cabH, U * 0.027, "<i></i>" + txt);
    if (marciel) h += cx("info", infX, cabY + cabH * 0.54, infW, cabH * 0.34, U * 0.022, "Marciel: " + marciel + " pães");
    h += fio("ouro", mx + W * 0.01, H * 0.111, larg - W * 0.02, Math.max(2, R(H / 360)));
    if (!dia || !cols.length) { raiz.innerHTML = h + '<div class="vazio" style="font-size:' + R(H * 0.06) + 'px">Sem entregas neste dia.</div>'; return; }

    var larg0 = larg * 0.283, lc = (larg - larg0) / cols.length, recuo = larg * 0.058, sepW = Math.max(1, e1);
    function colX(n) { return mx + larg0 + n * lc; }

    // ----- nomes -----
    var y = H * 0.127, hNome = H * 0.062;
    h += caixa("cabt", mx, y, larg, hNome, R(hNome * 0.3) + "px") + cx("prod", mx + recuo, y, larg0 - recuo, hNome, hNome * 0.55, "PRODUTOS");
    for (k = 0; k < cols.length; k++) {
      h += fio("", colX(k), y + hNome * 0.2, sepW, hNome * 0.6) +
        cx("ent", colX(k), y, lc, hNome, hNome * 0.6, '<i style="background:' + corDe(cols[k]) + '"></i>' + esc(cols[k].n.toUpperCase()));
    }
    y += hNome + H * 0.012;

    // ----- grupos: a altura da linha se ajusta para tudo caber -----
    var rodH = H * 0.118, rodY = H - rodH - H * 0.016, linhas = linhasDoDia(dia, cols), nG = 0, nL = 0;
    for (i = 0; i < linhas.length; i++) { if (linhas[i].t === "tit") nG++; else nL++; }
    var gap = 0.34, u = Math.min((rodY - H * 0.014 - y) / (nL + nG + Math.max(0, nG - 1) * gap), H * 0.07), raio = R(u * 0.26);
    for (i = 0; i < linhas.length; i++) {
      var L = linhas[i];
      if (L.t === "tit") {
        if (i) y += u * gap;
        var dh = u * 0.82, dw = dh * 48 / 32;
        h += caixa("faixa", mx, y, larg, u, raio + "px " + raio + "px 0 0") +
          svg(mx + recuo - dw - larg * 0.004, y + (u - dh) / 2, dw, dh, "0 0 48 32", DESENHO[L.rot] || "") +
          cx("grupo", mx + recuo + larg * 0.008, y, larg0, u, u * 0.68, esc(L.rot));
      } else {
        h += cx("rot", mx + recuo, y, larg0 - recuo, u, u * 0.74, esc(L.rot));
        for (k = 0; k < cols.length; k++) {
          h += fio("", colX(k), y, sepW, u) + (L.v[k] ? cx("n", colX(k), y, lc, u, u * 0.86, String(L.v[k])) : cx("z", colX(k), y, lc, u, u * 0.74, "–"));
        }
        h += fio("", mx, y + u - e1, larg, e1);
      }
      y += u;
    }

    // ----- rodapé: quantas entregas cada um vai fazer -----
    var tr = rodH * 0.62;
    h += caixa("rod", mx, rodY, larg, rodH, R(rodH * 0.2) + "px") +
      svg(mx + larg * 0.022, rodY + (rodH - tr) / 2, tr, tr, "0 0 24 24", CAMINHAO, TRACO + 'stroke="#f7dc8c" stroke-width="1.6"') +
      cx("rodl", mx + larg * 0.105, rodY + rodH * 0.17, larg0 - larg * 0.11, rodH * 0.33, rodH * 0.27, "ENTREGAS") +
      cx("rodl", mx + larg * 0.105, rodY + rodH * 0.5, larg0 - larg * 0.11, rodH * 0.33, rodH * 0.27, "PROGRAMADAS") +
      fio("", mx + larg * 0.09, rodY + rodH * 0.2, sepW, rodH * 0.6);
    for (k = 0; k < cols.length; k++) {
      h += fio("", colX(k), rodY + rodH * 0.2, sepW, rodH * 0.6) +
        cx("rodn", colX(k), rodY + rodH * 0.07, lc, rodH * 0.28, rodH * 0.23, esc(cols[k].n.toUpperCase())) +
        cx("rodv", colX(k), rodY + rodH * 0.33, lc, rodH * 0.6, rodH * 0.58, String(cols[k].ent || 0));
    }
    raiz.innerHTML = h;
  }

  // ----- vida da tela -----
  var guardado = lerGuardado();
  if (guardado) { try { aceitar(guardado); } catch (e) {} }
  desenhar();
  if (cod) { buscar(); setInterval(buscar, 60000); }
  setInterval(desenhar, 30000);                   // troca de dia na hora certa, mesmo sem internet
  window.onresize = desenhar;
  // Um toque (OK do controle com o mouse ligado) abre em tela cheia, sem a barra do navegador
  function telaCheia() {
    try { var e = document.documentElement, f = e.requestFullscreen || e.webkitRequestFullscreen || e.mozRequestFullScreen; if (f) f.call(e); } catch (er) {}
  }
  document.onclick = telaCheia;
  document.onkeydown = function (ev) { if ((ev || window.event).keyCode === 13) telaCheia(); };
})();
</script>
</body></html>
