<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quadro das entregas</title>
<style>
/* Quadro do projetor: tela cheia 16:9, sem rolagem. CSS simples (sem variáveis nem grid) para navegador antigo de TV/projetor. */
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;cursor:none}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#ffffff;color:#000000}
body.escuro{background:#000000;color:#ffffff}
#raiz{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.cab{position:absolute;left:0;top:0;width:100%;overflow:hidden}
.dia{position:absolute;left:2%;top:0;white-space:nowrap;font-weight:800;letter-spacing:.02em}
.dia b{display:inline-block;background:#f2b705;color:#2b1d12;border-radius:.18em;padding:0 .35em;margin-left:.3em}
.hora{position:absolute;right:2%;top:0;text-align:right;white-space:nowrap;font-weight:700}
.aviso{font-weight:700;color:#b0503a}
body.escuro .aviso{color:#ffb199}
.lin{position:absolute;left:0;width:100%;white-space:nowrap;box-sizing:border-box;border-bottom:3px dashed #000}
body.escuro .lin{border-bottom-color:#fff}
.c{position:absolute;top:0;height:100%;text-align:center;overflow:hidden;box-sizing:border-box}
.c0{text-align:left}
.zb{background:transparent}
body.escuro .zb{background:transparent}
.nome{color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.tit{background:#e4e4e4;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
body.escuro .tit{background:#2b2b2b;color:#ffd479}
.tot{font-weight:800}
.rod{background:#000;color:#fff;font-weight:800}
body.escuro .rod{background:#fff4e0;color:#14100c}
.rod small{font-weight:700;opacity:.85}
.vazio{position:absolute;left:0;top:40%;width:100%;text-align:center;font-weight:700}
</style></head><body>
<div id="raiz"></div>
<script>
(function () {
  var CHAVE = "AIzaSyCDjC2i08rrbegFaBAPRg33wJLuHLjmEWk";   // chave pública do app web (a mesma da tela de rota)
  var URL_BASE = "https://firestore.googleapis.com/v1/projects/pao-na-cesta/databases/(default)/documents/publico/quadro-";
  var DOW = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
  var raiz = document.getElementById("raiz");

  // ----- parâmetros do link: #código (ou ?t=código), ?tema=escuro, ?virada=HH:MM -----
  function param(nome) {
    var m = new RegExp("[?&]" + nome + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }
  var cod = (location.hash || "").replace(/^#/, "").split("?")[0] || param("t");
  if (param("tema") === "escuro") document.body.className = "escuro";
  var viradaLink = param("virada");

  var dados = null, ultimoOk = "", offline = false, erroLink = false, aguardando = false;
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function dois(n) { return (n < 10 ? "0" : "") + n; }

  // Horário de Brasília (UTC-3, sem horário de verão desde 2019), não importa o fuso do aparelho
  function agoraSP() {
    var t = new Date(new Date().getTime() - 3 * 3600 * 1000);
    return { D: t.getUTCFullYear() + "-" + dois(t.getUTCMonth() + 1) + "-" + dois(t.getUTCDate()), min: t.getUTCHours() * 60 + t.getUTCMinutes(),
      hm: dois(t.getUTCHours()) + ":" + dois(t.getUTCMinutes()) };
  }
  function minutos(hm, padrao) {
    var m = /^(\d{1,2}):(\d\d)$/.exec(hm || "");
    return m ? Number(m[1]) * 60 + Number(m[2]) : padrao;
  }
  function somaDia(D, n) {
    var p = D.split("-"), t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return t.getUTCFullYear() + "-" + dois(t.getUTCMonth() + 1) + "-" + dois(t.getUTCDate());
  }

  // ----- busca o quadro (a cada 60 s) -----
  function guardar(txt) { try { localStorage.setItem("quadroTv:" + cod, txt); } catch (e) {} }
  function lerGuardado() { try { return localStorage.getItem("quadroTv:" + cod); } catch (e) { return null; } }
  function aceitar(txt) {
    var o = JSON.parse(txt);
    if (o && o.dias) { dados = o; return true; }
    return false;
  }
  function buscar() {
    var x = new XMLHttpRequest(), pronto = false;
    x.open("GET", URL_BASE + encodeURIComponent(cod) + "?key=" + CHAVE + "&_=" + new Date().getTime(), true);
    x.timeout = 20000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || pronto) return;
      pronto = true;
      if (x.status === 200) {
        try {
          var j = JSON.parse(x.responseText), txt = j.fields.json.stringValue;
          if (aceitar(txt)) { guardar(txt); offline = false; erroLink = false; aguardando = false; ultimoOk = agoraSP().hm; }
        } catch (e) { offline = true; }
      } else if (x.status === 404) { if (!dados) aguardando = true; else offline = true; }
      else if (x.status === 403) { if (!dados) erroLink = true; else offline = true; }
      else offline = true;
      desenhar();
    };
    x.onerror = x.ontimeout = function () { if (pronto) return; pronto = true; offline = true; desenhar(); };
    try { x.send(); } catch (e) { offline = true; desenhar(); }
  }

  // ----- qual dia mostrar: hoje até a hora da virada; depois, o próximo dia com entrega -----
  function diaMostrado(a) {
    var lista = [], k;
    for (k in dados.dias) if (dados.dias.hasOwnProperty(k)) lista.push(k);
    lista.sort();
    if (!lista.length) return { D: "", velho: true };
    var virada = minutos(viradaLink || dados.virada, 14 * 60);
    var alvo = a.min >= virada ? somaDia(a.D, 1) : a.D;
    for (var i = 0; i < lista.length; i++) if (lista[i] >= alvo) return { D: lista[i], velho: false };
    return { D: lista[lista.length - 1], velho: true };   // o quadro publicado já ficou para trás
  }

  // ----- monta as linhas da tabela -----
  function soma(cols, f) { var t = 0; for (var i = 0; i < cols.length; i++) t += f(cols[i]) || 0; return t; }
  function linhasDoDia(dia, cols) {
    var out = [], i, j, q, tams = {}, lis;
    for (i = 0; i < cols.length; i++) for (q in (cols[i].sac || {})) if (cols[i].sac.hasOwnProperty(q) && cols[i].sac[q] > 0) tams[q] = 1;
    var ordem = []; for (q in tams) if (tams.hasOwnProperty(q)) ordem.push(Number(q));
    ordem.sort(function (a, b) { return b - a; });
    function bloco(titulo, itens, rotulo, pega) {
      if (!itens.length) return;
      out.push({ t: "tit", rot: titulo });
      for (var n = 0; n < itens.length; n++) {
        (function (it) {
          var v = [], tot = 0;
          for (var c = 0; c < cols.length; c++) { var x = pega(cols[c], it) || 0; v.push(x); tot += x; }
          out.push({ t: "lin", rot: rotulo(it), v: v, tot: tot });
        })(itens[n]);
      }
    }
    bloco("Sacolas de pão francês", ordem, function (q) { return q + " pães"; }, function (c, q) { return (c.sac || {})[q]; });
    function comAlgo(lista) {
      var r = [];
      for (var n = 0; n < (lista || []).length; n++) if (soma(cols, function (c) { return (c.fri || {})[lista[n]]; }) > 0) r.push(lista[n]);
      return r;
    }
    var pegaF = function (c, it) { return (c.fri || {})[it]; }, rot = function (it) { return it; };
    bloco("Pão especial", comAlgo(dia.esp), rot, pegaF);
    bloco("Frios", comAlgo(dia.fri), rot, pegaF);
    return out;
  }

  // ----- desenha tudo para caber exatamente na tela -----
  function cel(cls, esq, larg, html, extra) {
    return '<div class="c ' + cls + '" style="left:' + esq + 'px;width:' + larg + 'px;' + (extra || "") + '">' + html + "</div>";
  }
  var CORES = { Careca: "#D32F2F", Dennis: "#2E9E4F", Miro: "#1E5FBF", Bruno: "#6B7280" };
  function corDe(c) { return CORES[c.n] || c.cor || "#6b4a2e"; }
  function rgba(hex, a) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
    if (!m) return "rgba(107,74,46," + a + ")";
    return "rgba(" + parseInt(m[1], 16) + "," + parseInt(m[2], 16) + "," + parseInt(m[3], 16) + "," + a + ")";
  }
  function desenhar() {
    var W = window.innerWidth || document.documentElement.clientWidth, H = window.innerHeight || document.documentElement.clientHeight;
    if (!W || !H) return;
    var h = "";
    if (erroLink || !cod) { raiz.innerHTML = '<div class="vazio" style="font-size:' + Math.round(H * 0.06) + 'px">Link do quadro incorreto.<br>Peça o link novo ao Marciel.</div>'; return; }
    if (!dados && aguardando) { raiz.innerHTML = '<div class="vazio" style="font-size:' + Math.round(H * 0.055) + 'px">Aguardando o primeiro quadro.<br>Abra a gestão no computador.</div>'; return; }
    if (!dados) { raiz.innerHTML = '<div class="vazio" style="font-size:' + Math.round(H * 0.06) + 'px">Carregando o quadro…</div>'; return; }

    var escuro = /escuro/.test(document.body.className);
    var a = agoraSP(), sel = diaMostrado(a), dia = dados.dias[sel.D];
    var p = sel.D.split("-"), dow = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
    var hCab = Math.round(H * 0.13);
    // cabeçalho
    var fDia = Math.round(hCab * 0.6), fHora = Math.round(hCab * 0.32);
    var aviso = "";
    if (offline) aviso = '<div class="aviso" style="font-size:' + Math.round(fHora * 0.75) + 'px">Sem internet · mostrando o último quadro</div>';
    else if (sel.velho) aviso = '<div class="aviso" style="font-size:' + Math.round(fHora * 0.75) + 'px">Quadro desatualizado · abra a gestão</div>';
    h += '<div class="cab" style="height:' + hCab + 'px">' +
      '<div class="dia" style="font-size:' + fDia + 'px;line-height:' + hCab + 'px">' + esc(DOW[dow].toUpperCase()) + "<b>" + p[2] + "/" + p[1] + "</b></div>" +
      '<div class="hora" style="font-size:' + fHora + 'px;line-height:' + Math.round(hCab * (aviso ? 0.5 : 1)) + 'px">Atualizado às ' + esc(ultimoOk || a.hm) + aviso + "</div></div>";

    // o Marciel não ganha coluna: vira uma observação pequena no canto
    var todos = (dia && dia.cols) || [], cols = [], marciel = 0, i, j;
    for (i = 0; i < todos.length; i++) { if (todos[i].n === "Marciel") marciel += todos[i].paes || 0; else cols.push(todos[i]); }
    if (!dia || !cols.length) {
      raiz.innerHTML = h + '<div class="vazio" style="font-size:' + Math.round(H * 0.07) + 'px">Sem entregas neste dia.</div>';
      return;
    }
    var linhas = linhasDoDia(dia, cols);
    // linhas: nomes + (títulos e itens) + 2 de rodapé
    var nLin = 1.15 + linhas.length + 2, areaH = H - hCab - Math.round(H * 0.01);
    var hLin = Math.floor(areaH / nLin), maxL = Math.round(H * 0.14);
    if (hLin > maxL) hLin = maxL;
    var larg0 = Math.round(W * 0.2), nc = cols.length + 1, lc = Math.floor((W - larg0 - Math.round(W * 0.005)) / nc);
    var fN = Math.round(hLin * 0.66), fT = Math.round(hLin * 0.5), fNum = Math.round(hLin * 0.84);
    var y = hCab, zeb = 0, tintA = escuro ? 0.5 : 0.3, bc = escuro ? "#fff" : "#000", bw = Math.max(3, Math.round(W * 0.0025));
    function abre(cls, alt, extra) { var t = '<div class="lin ' + cls + '" style="top:' + y + "px;height:" + alt + "px;font-size:" + fN + "px;line-height:" + (alt - 3) + "px;" + (extra || "") + '">'; y += alt; return t; }
    // fundo colorido da coluna do entregador + faixa grossa na esquerda, para a coluna aparecer de longe
    function fundoCol(c) { return "background:" + rgba(corDe(c), tintA) + ";border-left:" + bw + "px dashed " + bc + ";"; }
    var fundoTot = "background:" + (escuro ? "rgba(242,183,5,.45)" : "rgba(242,183,5,.5)") + ";border-left:" + bw + "px dashed " + bc + ";";

    // faixa larga com o nome e a cor de cada entregador
    var hNome = Math.round(hLin * 1.15), fNome = Math.round(hLin * 0.62), raio = Math.round(hLin * 0.12);
    var s = abre("", hNome, "border-bottom:0");
    var obs = marciel ? '<span style="font-size:' + Math.round(hLin * 0.42) + 'px;font-weight:800">+ Marciel: ' + marciel + ' pães</span>' : "";
    s += cel("c0", 14, larg0 - 14, obs, "");
    for (i = 0; i < cols.length; i++) {
      s += cel("nome", larg0 + i * lc + 3, lc - 6, esc(cols[i].n), "background:" + corDe(cols[i]) + ";font-size:" + fNome + "px;border-radius:" + raio + "px;height:94%");
    }
    s += cel("nome", larg0 + cols.length * lc + 3, lc - 6, "TOTAL", "background:#f2b705;color:#2b1d12;font-size:" + fNome + "px;border-radius:" + raio + "px;height:94%");
    h += s + "</div>";

    for (i = 0; i < linhas.length; i++) {
      var L = linhas[i];
      if (L.t === "tit") {
        zeb = 0;
        h += abre("tit", hLin, "font-size:" + fT + "px") + cel("c0", 14, W - 28, esc(L.rot), "") + "</div>";
      } else {
        var z = (zeb++ % 2 === 1) ? "zb" : "";
        s = abre(z, hLin) + cel("c0", 14, larg0 - 14, "<b>" + esc(L.rot) + "</b>", "font-weight:800");
        for (j = 0; j < L.v.length; j++) s += cel("", larg0 + j * lc, lc, L.v[j] ? String(L.v[j]) : "", fundoCol(cols[j]) + "font-size:" + fNum + "px;font-weight:800");
        s += cel("tot", larg0 + L.v.length * lc, lc, L.tot ? String(L.tot) : "", fundoTot + "font-size:" + fNum + "px;font-weight:900");
        h += s + "</div>";
      }
    }
    // rodapé: total de entregas e de pães de cada entregador
    var te = soma(cols, function (c) { return c.ent; }), tp = soma(cols, function (c) { return c.paes; });
    function rodape(rot, pega, tot) {
      var t = abre("rod", hLin, "border-bottom:0") + cel("c0", 14, larg0 - 14, rot, "font-size:" + fT + "px");
      for (var k = 0; k < cols.length; k++) t += cel("", larg0 + k * lc, lc, String(pega(cols[k]) || 0), "background:" + corDe(cols[k]) + ";color:#fff;border-left:" + bw + "px dashed #fff;font-size:" + fNum + "px;font-weight:900");
      return t + cel("", larg0 + cols.length * lc, lc, String(tot), "background:#f2b705;color:#000;border-left:" + bw + "px dashed #fff;font-size:" + fNum + "px;font-weight:900") + "</div>";
    }
    h += rodape("ENTREGAS", function (c) { return c.ent; }, te) + rodape("PÃES", function (c) { return c.paes; }, tp);
    raiz.innerHTML = h;
  }

  // ----- vida da tela -----
  var guardado = lerGuardado();
  if (guardado) { try { aceitar(guardado); } catch (e) {} }
  desenhar();
  if (cod) { buscar(); setInterval(buscar, 60000); }
  setInterval(desenhar, 30000);                   // troca de dia na hora certa, mesmo sem internet
  window.onresize = desenhar;
  // Um toque (OK do controle com o mouse ligado) abre em tela cheia, sem a barra do navegador
  function telaCheia() {
    try { var e = document.documentElement, f = e.requestFullscreen || e.webkitRequestFullscreen || e.mozRequestFullScreen; if (f) f.call(e); } catch (er) {}
  }
  document.onclick = telaCheia;
  document.onkeydown = function (ev) { if ((ev || window.event).keyCode === 13) telaCheia(); };
})();
</script>
</body></html>
